<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>簿記3級チャット</title>
  <style>
    :root {
      --theme-color: #8a4b2b;
      --theme-color-dark: #4d2814;
    }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--theme-color-dark);
  padding: 0;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

.container {
  background: white;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, var(--theme-color) 0%, var(--theme-color-dark) 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-icon { font-size: 32px; }

.header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.header-text p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.header-btn:hover { background: rgba(255,255,255,0.3); }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.message { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 2px;
}

.message.bot .avatar { background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark)); }
.message.user .avatar { background: #e8f0fe; }

.bubble {
  max-width: 78%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.bot .bubble {
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-top-left-radius: 4px;
  color: #333;
}

.message.user .bubble {
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border-top-right-radius: 4px;
}

.bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
.bubble li { margin: 2px 0; }
.bubble strong { font-weight: 700; }
.bubble em { font-style: italic; }
.bubble code {
  background: #eceefb; color: #4b4f9e;
  padding: 1px 5px; border-radius: 4px;
  font-family: 'Consolas', monospace; font-size: 13px;
}
.bubble pre {
  background: #2b2d42; color: #e8eaf6;
  padding: 10px 12px; border-radius: 8px;
  overflow-x: auto; margin: 6px 0; font-size: 13px;
  font-family: 'Consolas', monospace; white-space: pre;
}
.bubble a { color: var(--theme-color); text-decoration: underline; }
.bubble p { margin: 4px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }

.typing { display: flex; gap: 5px; padding: 14px 16px; }
.typing span {
  width: 8px; height: 8px; background: #9e9e9e; border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-8px); }
}

.input-area {
  padding: 16px 20px;
  border-top: 1px solid #eee;
  display: flex;
  gap: 10px;
  background: #fafafa;
  justify-content: center;
}
.input-area textarea { max-width: 850px; }

textarea {
  flex: 1;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  max-height: 120px;
  min-height: 44px;
  line-height: 1.5;
}

textarea:focus { border-color: var(--theme-color); }
textarea::placeholder { color: #bbb; }

.send-btn {
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
  border-radius: 12px;
  width: 48px;
  height: 48px;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s, transform 0.1s;
  flex-shrink: 0;
  align-self: flex-end;
}

.send-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.05); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.welcome { text-align: center; padding: 30px 20px; color: #888; }
.welcome h2 { font-size: 22px; color: #555; margin-bottom: 8px; }
.welcome p { font-size: 14px; line-height: 1.7; }

.syllabus {
  margin-top: 22px;
  text-align: left;
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
}

.syllabus-label {
  font-size: 12px;
  color: #999;
  text-align: center;
  margin-bottom: 10px;
}

.syllabus-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chapter-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  background: white;
  border: 1px solid #e6e8ee;
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #333;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.chapter-item:hover {
  background: #f8f9ff;
  border-color: var(--theme-color);
}

.chapter-num {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--theme-color);
  color: white;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chapter-name { flex: 1; line-height: 1.4; }

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
}

.suggestion-chip {
  background: #f0f0ff;
  border: 1px solid #c5cae9;
  color: var(--theme-color);
  border-radius: 20px;
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}

.suggestion-chip:hover { background: #e8eaf6; }

.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

@media (max-width: 600px) {
  body { padding: 0; }
  .container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
  }
  .header { padding: 12px 14px; gap: 10px; }
  .header-icon { font-size: 28px; }
  .header-text h1 { font-size: 18px; }
  .header-text p { display: none; }
  .header-actions { gap: 6px; }
  .messages { padding: 14px; gap: 13px; }
  .bubble { max-width: 88%; font-size: 16.5px; line-height: 1.7; }
  .welcome h2 { font-size: 21px; }
  .welcome p { font-size: 15.5px; }
  .suggestion-chip { font-size: 14.5px; padding: 9px 15px; }
  .syllabus { max-width: none; }
  .chapter-item { font-size: 14.5px; padding: 11px 14px; }
  .input-area {
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  textarea { font-size: 16px; min-height: 46px; }
  .send-btn { width: 48px; height: 48px; font-size: 20px; }
}

@media (max-height: 480px) {
  .welcome { padding: 16px 14px; }
  .welcome h2 { font-size: 18px; margin-bottom: 4px; }
}

  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-icon">📊</div>
    <div class="header-text">
      <h1>簿記3級チャット</h1>
      <p>簿記3級の質問にお答えします</p>
    </div>
    <div class="header-actions">
      <a class="header-btn" href="../">← ポータル</a>
      <button class="header-btn" onclick="resetChat()">🏠 最初に戻る</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome">
      <h2>👋 こんにちは！</h2>
      <p>仕訳・現金預金・商品売買・手形・固定資産・決算整理など、簿記3級の頻出論点について聞いてください。</p>

      <div class="syllabus">
        <div class="syllabus-label">📖 学習シラバス（タップして質問できます）</div>
        <div class="syllabus-list">
          <button class="chapter-item" onclick="sendChapter(this)">
            <span class="chapter-num">1</span>
            <span class="chapter-name">簿記の基礎（仕訳・勘定科目・貸借対照表/損益計算書）</span>
          </button>
          <button class="chapter-item" onclick="sendChapter(this)">
            <span class="chapter-num">2</span>
            <span class="chapter-name">現金・預金</span>
          </button>
          <button class="chapter-item" onclick="sendChapter(this)">
            <span class="chapter-num">3</span>
            <span class="chapter-name">商品売買</span>
          </button>
          <button class="chapter-item" onclick="sendChapter(this)">
            <span class="chapter-num">4</span>
            <span class="chapter-name">手形・電子記録債権債務</span>
          </button>
          <button class="chapter-item" onclick="sendChapter(this)">
            <span class="chapter-num">5</span>
            <span class="chapter-name">固定資産・引当金</span>
          </button>
          <button class="chapter-item" onclick="sendChapter(this)">
            <span class="chapter-num">6</span>
            <span class="chapter-name">決算整理・精算表・財務諸表作成</span>
          </button>
        </div>
      </div>

      <div class="suggestions" id="suggestions">
      <button class="suggestion-chip" onclick="sendSuggestion(this)">貸倒引当金の仕訳は？</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">精算表の作り方は？</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">売上原価の計算方法は？</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="userInput"
      placeholder="質問を入力してください..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyRmJ0BUzllzyP5nVPzz5kbzddOmMrbFiII28HgFrNuGxBRLrvQYf3qDu0y_4pXGcHX/exec';
  const SHARED_SECRET = 'KsXaOFyluiW9omxeR1xjUjKvtNN4jPGH';
  const EXAM_ID = 'boki3';
// GAS_WEBAPP_URL / SHARED_SECRET / EXAM_ID は build_html.js がビルド時にこのファイルの
// 直前へ `const GAS_WEBAPP_URL = '...';` 等として注入する。

let isLoading = false;
let history = []; // 会話履歴 [{ role:'user'|'bot', text }]

const WELCOME_HTML = document.getElementById('messages').innerHTML;

function resetChat() {
  if (history.length && !confirm('会話をリセットして最初の画面に戻りますか？')) return;
  history = [];
  setLoading(false);
  document.getElementById('messages').innerHTML = WELCOME_HTML;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function sendSuggestion(btn) {
  const text = btn.textContent.trim().replace(/^[^\p{L}\p{N}]+/u, '');
  document.getElementById('userInput').value = text;
  sendMessage();
}

function sendChapter(el) {
  const name = el.querySelector('.chapter-name').textContent.trim();
  document.getElementById('userInput').value = name + 'について教えて';
  sendMessage();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  const priorHistory = history.slice();
  appendMessage('user', text);
  history.push({ role: 'user', text: text });
  input.value = '';
  input.style.height = 'auto';

  const typingEl = appendTyping();
  setLoading(true);

  try {
    const res = await callBackend(text, priorHistory);
    typingEl.remove();
    setLoading(false);
    if (res.ok) {
      appendMessage('bot', res.message);
      history.push({ role: 'bot', text: res.message });
    } else {
      appendMessage('bot', '⚠️ ' + res.error);
    }
  } catch (err) {
    typingEl.remove();
    setLoading(false);
    appendMessage('bot', '⚠️ 通信エラーが発生しました: ' + (err && err.message ? err.message : err));
  }
}

async function callBackend(message, priorHistory) {
  const res = await fetch(GAS_WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORSプリフライト回避
    body: JSON.stringify({
      secret: SHARED_SECRET,
      examId: EXAM_ID,
      message: message,
      history: priorHistory,
    }),
  });
  return res.json();
}

function appendMessage(role, text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? '🤖' : '🙋';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'bot') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

// 簡易Markdown→HTML（XSS対策でエスケープ後に変換）
function renderMarkdown(md) {
  let h = String(md).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const codeBlocks = [];
  h = h.replace(/```[\w]*\n?([\s\S]*?)```/g, function (_, c) {
    codeBlocks.push(c.replace(/\n$/, ''));
    return ' CB' + (codeBlocks.length - 1) + ' ';
  });
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = h.split('\n');
  let out = '', listType = null;
  const closeList = function () { if (listType) { out += '</' + listType + '>'; listType = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (m = line.match(/^\s*[-*・]\s+(.*)$/)) {
      if (listType !== 'ul') { closeList(); out += '<ul>'; listType = 'ul'; }
      out += '<li>' + m[1] + '</li>';
    } else if (m = line.match(/^\s*\d+[.)]\s+(.*)$/)) {
      if (listType !== 'ol') { closeList(); out += '<ol>'; listType = 'ol'; }
      out += '<li>' + m[1] + '</li>';
    } else if (m = line.match(/^\s*#{1,4}\s+(.*)$/)) {
      closeList(); out += '<p><strong>' + m[1] + '</strong></p>';
    } else if (line.trim() === '') {
      closeList();
    } else {
      closeList(); out += '<p>' + line + '</p>';
    }
  }
  closeList();
  out = out.replace(/ CB(\d+) /g, function (_, n) {
    return '<pre>' + codeBlocks[n] + '</pre>';
  });
  return out;
}

function appendTyping() {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message bot';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';

  div.appendChild(avatar);
  div.appendChild(bubble);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function setLoading(state) {
  isLoading = state;
  document.getElementById('sendBtn').disabled = state;
  document.getElementById('userInput').disabled = state;
}

</script>
</body>
</html>
